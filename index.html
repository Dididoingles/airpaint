<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://dididoingles.github.io/airpaint/faviair.png">
    <link rel="apple-touch-icon" href="https://dididoingles.github.io/airpaint/faviair.png">

    <!-- SEO básico -->
    <meta name="description" content="AirPaint: ferramentas interativas para praticar inglês com gestos, desenho e voz. Atividades gratuitas para alunos da professora @dicarvalho.prof.">
    <meta name="theme-color" content="#c20000">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="AirPaint — Inglês com gestos">
    <meta property="og:description" content="Desenhe no ar e aprenda inglês de forma visual e interativa.">
    <meta property="og:image" content="https://dididoingles.github.io/airpaint/metaair.png">
    <meta property="og:url" content="https://dididoingles.github.io/airpaint/">
    <meta property="og:site_name" content="AirPaint">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AirPaint — Inglês com gestos">
    <meta name="twitter:description" content="Desenhe no ar e aprenda inglês de forma visual e interativa.">
    <meta name="twitter:image" content="https://dididoingles.github.io/airpaint/metaair.png">

    <title>AirPaint — Atividades de Inglês</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #222222;
            --paper: #ffffff;
            --accent: #c20000;
            --accent-dark: #a30000;
            --muted: #666666;
            --shadow-hard-sm: 2px 3px 0 rgba(34, 34, 34, 0.85);
        }

        html, body { width: 100%; overflow-x: hidden; }

        body {
            background-color: var(--paper);
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.05em;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        /* LOADER */
        .loader-screen {
            position: fixed; inset: 0;
            background: var(--paper);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 22px; z-index: 9999;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }
        .loader-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-spinner {
            width: 46px; height: 46px; border-radius: 50%;
            border: 3px solid rgba(194, 0, 0, 0.15);
            border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            font-size: 19px;
            color: var(--ink);
            opacity: 0.75;
        }

        /* TOPBAR */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px;
            position: relative; z-index: 20;
        }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-title {
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: 22px; line-height: 1;
            color: var(--accent); letter-spacing: -0.05em;
        }
        .brand-title span { color: var(--ink); }
        .brand-badge {
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            font-size: 13px;
            color: var(--ink);
            background: #fff5f5;
            border: 1.5px solid var(--accent);
            border-radius: 20px;
            padding: 3px 10px;
            transform: rotate(-3deg);
        }

        .topbar-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            font-size: 15px;
            color: var(--ink);
            text-decoration: none;
            padding: 6px 12px;
            border: 1.5px solid var(--ink);
            border-radius: 12px;
            background: var(--paper);
            box-shadow: var(--shadow-hard-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
        }
        .topbar-link:hover {
            background: #fff5f5;
            transform: translate(1px, 1px);
            box-shadow: 1px 2px 0 rgba(34, 34, 34, 0.85);
        }
        .topbar-link:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 rgba(34, 34, 34, 0.85);
        }
        .topbar-link svg {
            width: 13px; height: 13px;
            stroke: currentColor; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        /* HERO */
        .hero {
            position: relative;
            text-align: center;
            padding: 26px 20px 34px;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -55%; left: 50%;
            width: 90vmax; height: 90vmax;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(194, 0, 0, 0.08) 0%, transparent 62%);
            border-radius: 50%;
            pointer-events: none;
            animation: auraBreath 10s ease-in-out infinite;
        }
        @keyframes auraBreath {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50%      { transform: translateX(-50%) scale(1.12); }
        }
        .hero > * { position: relative; z-index: 1; }

        .hero-kicker {
            display: inline-flex; align-items: center; gap: 10px;
            font-weight: 600; font-size: 10px;
            letter-spacing: 0.28em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 12px;
        }
        .hero-kicker::before, .hero-kicker::after {
            content: ''; width: 22px; height: 1.5px;
            background: currentColor;
        }
        .hero-title {
            font-weight: 700;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
        }
        .hero-title .scribble {
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            font-weight: 400;
            color: var(--accent);
            position: relative;
            white-space: nowrap;
        }
        .hero-title .scribble::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -4px;
            height: 8px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 10' preserveAspectRatio='none'><path d='M2 7 C 20 2, 40 9, 60 5 S 90 3, 98 6' stroke='%23c20000' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
            opacity: 0.85;
        }
        .hero-subtitle {
            font-family: 'Gochi Hand', cursive;
            letter-spacing: normal;
            font-size: 17px;
            color: var(--muted);
            max-width: 460px;
            margin: 0 auto;
            line-height: 1.45;
        }

        /* GRID DE ATIVIDADES */
        .tools-section {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 16px 42px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .tool-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid rgba(34,34,34,0.06);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 12px 12px;
            gap: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition:
                transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.4s ease,
                border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            animation: cardEnter 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 40%, var(--aura, #c20000) 0%, transparent 70%);
            opacity: 0.06;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .tool-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(0,0,0,0.10),
                0 8px 16px var(--aura-shadow, rgba(120,0,0,0.15));
            border-color: rgba(34,34,34,0.02);
        }
        .tool-card:hover::before { opacity: 0.16; }

        .tool-card:active {
            transform: translateY(-2px) scale(0.99);
        }

        .tool-card-art {
            width: 68%;
            max-width: 120px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 16px var(--aura-shadow, rgba(0,0,0,0.2)));
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tool-card:hover .tool-card-art {
            transform: scale(1.08) rotate(-2deg);
        }

        .tool-card-name {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #222222;
            letter-spacing: -0.03em;
            line-height: 1.15;
            text-align: center;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: auto;
            padding-bottom: 2px;
        }

        /* CTA final */
        .hub-cta {
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--accent);
            color: #ffffff;
            font-family: 'Gochi Hand', cursive;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 0.02em;
            padding: 0 22px;
            height: 46px;
            border: 2px solid var(--ink);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-hard-sm);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
        }
        .action-btn:hover {
            background-color: var(--accent-dark);
            transform: translateY(1px) translateX(1px);
            box-shadow: 1px 2px 0 rgba(34, 34, 34, 0.85);
        }
        .action-btn:active {
            transform: translateY(3px) translateX(2px);
            box-shadow: 0 0 0 rgba(34, 34, 34, 0.85);
        }
        .action-btn svg {
            width: 15px; height: 15px;
            stroke: #ffffff; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        /* FOOTER */
        .site-footer {
            width: 100%;
            text-align: center;
            padding: 28px 20px 26px;
            margin-top: auto;
            border-top: 1.5px dashed rgba(34, 34, 34, 0.18);
        }
        .footer-text {
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
            line-height: 1.7;
            letter-spacing: -0.02em;
        }
        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: color 0.25s ease;
            white-space: nowrap;
        }
        .footer-link::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -2px;
            height: 1.5px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-link:hover { color: var(--accent-dark); }
        .footer-link:hover::after { transform: scaleX(1); transform-origin: left; }
        .footer-ig {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 6px;
        }
        .footer-ig svg {
            width: 14px; height: 14px;
            stroke: currentColor; stroke-width: 2;
            fill: none;
        }

        /* TABLET */
        @media (min-width: 640px) {
            .tools-section { max-width: 780px; }
            .tools-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
            .tool-card-art { max-width: 110px; }
        }

        /* DESKTOP */
        @media (min-width: 900px) {
            .topbar { padding: 24px 60px; }
            .brand-title { font-size: 26px; }
            .brand-badge { font-size: 14px; }
            .topbar-link { font-size: 16px; padding: 7px 14px; }

            .hero { padding: 42px 40px 52px; }
            .hero-title { font-size: 46px; }
            .hero-subtitle { font-size: 20px; max-width: 560px; }

            .tools-section { max-width: 860px; padding: 18px 40px 60px; }
            .tools-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }

            .tool-card {
                padding: 20px 14px 14px;
                gap: 10px;
                border-radius: 20px;
            }
            .tool-card-art { width: 60%; max-width: 120px; }
            .tool-card-name { font-size: 14px; }

            .hub-cta { margin-top: 40px; }
            .action-btn { height: 50px; font-size: 17px; padding: 0 26px; }

            .site-footer { padding: 36px 60px 32px; }
            .footer-text { font-size: 12.5px; }
        }
    </style>
</head>
<body>

    <div class="loader-screen" id="loaderScreen" aria-hidden="true">
        <div class="loader-spinner"></div>
        <p class="loader-text">Preparando tudo</p>
    </div>

    <header class="topbar">
        <div class="brand">
            <span class="brand-title">Air<span>Paint</span></span>
            <span class="brand-badge">beta</span>
        </div>
        <a class="topbar-link" href="https://dididoingles.github.io/apps/">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Voltar ao site
        </a>
    </header>

    <section class="hero">
        <span class="hero-kicker">Hub de atividades</span>
        <h1 class="hero-title">
            Aprenda inglês <span class="scribble">desenhando</span>
        </h1>
        <p class="hero-subtitle">
            Escolha uma atividade e pratique vocabulário, emoções e pronúncia com gestos.
        </p>
    </section>

    <main class="tools-section">
        <div class="tools-grid" id="toolsGrid" aria-live="polite"></div>

        <div class="hub-cta">
            <a class="action-btn" href="pages/desenholivre/">
                Começar a desenhar
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <p class="footer-text">
            Desenvolvido pela professora
            <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link">@dicarvalho.prof</a>
        </p>
        <p class="footer-text">
            <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link footer-ig">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                Seguir no Instagram
            </a>
        </p>
    </footer>

    <script>
        const toolsData = [
            {
                title: 'Desenho Livre',
                link: 'pages/desenholivre/',
                art: 'assets/draw.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Jogo das Emoções',
                link: 'pages/emocoes/',
                art: 'assets/3.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Simon Says',
                link: 'pages/simon/',
                art: 'assets/4.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Speak & Draw',
                link: 'pages/speak/',
                art: 'assets/5.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Flashcard Challenge',
                link: 'pages/flashcard/',
                art: 'assets/6.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)'
            },
            {
                title: 'Us digital',
                link: 'https://dididoingles.github.io/estudeconosco/',
                art: 'assets/8.webp',
                color: '#c20000',
                auraShadow: 'rgba(120, 0, 0, 0.35)',
                external: true
            }
        ];

        const toolsGrid = document.getElementById('toolsGrid');

        toolsData.forEach((tool, i) => {
            const card = document.createElement('a');
            card.className = 'tool-card';
            card.href = tool.link;
            if (tool.external) {
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
            }
            card.style.setProperty('--aura', tool.color || '#c20000');
            card.style.setProperty('--aura-shadow', tool.auraShadow || 'rgba(120,0,0,0.35)');
            card.style.animationDelay = (i * 0.06) + 's';
            card.setAttribute('aria-label', 'Abrir ' + tool.title);

            const art = document.createElement('img');
            art.src = tool.art;
            art.alt = tool.title;
            art.className = 'tool-card-art';
            art.loading = 'lazy';

            const name = document.createElement('div');
            name.className = 'tool-card-name';
            name.textContent = tool.title;

            card.appendChild(art);
            card.appendChild(name);

            toolsGrid.appendChild(card);
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loaderScreen');
                if (loader) loader.classList.add('hidden');
            }, 350);
        });
        setTimeout(() => {
            const loader = document.getElementById('loaderScreen');
            if (loader && !loader.classList.contains('hidden')) loader.classList.add('hidden');
        }, 4000);
    </script>
</body>
</html>
