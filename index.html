<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Drawing Neon App</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Hands Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Área do Canvas de Desenho */
        #paintCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: transparent;
        }

        /* Preview da Webcam (Espelhada e discreta no canto inferior direito) */
        #webcamContainer {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 200px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #262626;
            z-index: 10;
            background: #1a1a1a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            transform: scaleX(-1); /* Espelha o vídeo para movimento natural */
            transition: border-color 0.3s ease;
        }

        #webcamContainer.active-draw { border-color: #c20000; }
        #webcamContainer.active-erase { border-color: #ffffff; }
        #webcamContainer.active-pause { border-color: #737373; }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Painel de Controle UI */
        #controlPanel {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 16px;
            width: 310px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        .panel-header {
            margin-bottom: 18px;
            border-bottom: 1px solid #262626;
            padding-bottom: 10px;
        }

        .panel-header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header h1 span {
            color: #c20000;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a3a3a3;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: 500;
        }

        /* Customização dos Inputs */
        .color-picker-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 8px;
            border: 2px solid #404040;
        }

        input[type="color"]::-moz-color-swatch {
            border-radius: 8px;
            border: 2px solid #404040;
        }

        /* Preset de Cores */
        .color-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid #404040;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .preset-btn:hover {
            transform: scale(1.1);
            border-color: #ffffff;
        }

        /* Slider de Espessura */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #262626;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #c20000;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Guia de Gestos Simples na UI */
        .gesture-guide {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #262626;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gesture-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #d4d4d4;
        }

        .gesture-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-draw { background: rgba(194, 0, 0, 0.15); color: #c20000; border: 1px solid rgba(194, 0, 0, 0.3); }
        .badge-erase { background: rgba(255, 255, 255, 0.1); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .badge-pause { background: rgba(115, 115, 115, 0.15); color: #a3a3a3; border: 1px solid rgba(115, 115, 115, 0.3); }

        /* Botão de Limpar Tela */
        .clear-btn {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #404040;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
            margin-top: 14px;
        }

        .clear-btn:hover {
            background: #c20000;
            border-color: #c20000;
        }

        /* Toast Container e Estilos */
        #toastContainer {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-left: 4px solid #c20000;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            font-size: 13px;
            font-weight: 500;
            min-width: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border-top: 1px solid #262626;
            border-right: 1px solid #262626;
            border-bottom: 1px solid #262626;
        }

        .toast.toast-erase { border-left-color: #ffffff; }
        .toast.toast-pause { border-left-color: #737373; }
        .toast.toast-info { border-left-color: #c20000; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        /* Loader Inicial */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0d0d;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #262626;
            border-top: 3px solid #c20000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        #loader p {
            font-size: 14px;
            color: #a3a3a3;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Loader Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Iniciando câmera e modelos de IA...</p>
    </div>

    <!-- Container de Toasts para UX limpa -->
    <div id="toastContainer"></div>

    <!-- Canvas de Pintura Principal -->
    <canvas id="paintCanvas"></canvas>

    <!-- UI de Controle Lateral -->
    <div id="controlPanel">
        <div class="panel-header">
            <h1>AirPaint <span>Neon</span></h1>
        </div>

        <!-- Escolha da Cor -->
        <div class="control-group">
            <div class="control-label">Cor do Neon</div>
            <div class="color-picker-wrapper">
                <input type="color" id="brushColor" value="#c20000">
                <div class="color-presets">
                    <div class="preset-btn" style="background: #c20000;" data-color="#c20000"></div>
                    <div class="preset-btn" style="background: #00ffcc;" data-color="#00ffcc"></div>
                    <div class="preset-btn" style="background: #00ff66;" data-color="#00ff66"></div>
                    <div class="preset-btn" style="background: #ff00ff;" data-color="#ff00ff"></div>
                    <div class="preset-btn" style="background: #ffff00;" data-color="#ffff00"></div>
                </div>
            </div>
        </div>

        <!-- Espessura da Linha -->
        <div class="control-group">
            <div class="control-label">
                <span>Espessura</span>
                <span id="thicknessVal">8px</span>
            </div>
            <input type="range" id="brushThickness" min="2" max="30" value="8">
        </div>

        <!-- Guia Visual de Gestos -->
        <div class="gesture-guide">
            <div class="control-label">Comandos de Gesto</div>
            <div class="gesture-item">
                <span>1 Dedo (Indicador)</span>
                <span class="gesture-badge badge-draw">Desenhar</span>
            </div>
            <div class="gesture-item">
                <span>Palma Aberta</span>
                <span class="gesture-badge badge-erase">Apagar</span>
            </div>
            <div class="gesture-item">
                <span>Punho Fechado</span>
                <span class="gesture-badge badge-pause">Pausar</span>
            </div>
        </div>

        <button class="clear-btn" id="clearCanvasBtn">Limpar Tela Completa</button>
    </div>

    <!-- Webcam Container (Invisível para captação direta, visível no preview espelhado) -->
    <div id="webcamContainer" id="webcamPreviewBox">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');
        const webcamContainer = document.getElementById('webcamContainer');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        
        // Elementos UI
        const brushColorInput = document.getElementById('brushColor');
        const brushThicknessInput = document.getElementById('brushThickness');
        const thicknessValDisplay = document.getElementById('thicknessVal');
        const clearCanvasBtn = document.getElementById('clearCanvasBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const toastContainer = document.getElementById('toastContainer');

        // Estado do Aplicativo
        let lastX = null;
        let lastY = null;
        let currentMode = 'pause'; // 'draw' | 'erase' | 'pause'
        let currentNeonColor = '#c20000';
        let currentThickness = 8;

        // Configuração de tamanho do canvas adaptável
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Garantir que o fundo se mantém preto transparente a cada resize
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Sincronizar UI com Estado Inicial
        brushColorInput.addEventListener('input', (e) => {
            currentNeonColor = e.target.value;
        });

        brushThicknessInput.addEventListener('input', (e) => {
            currentThickness = parseInt(e.target.value);
            thicknessValDisplay.innerText = `${currentThickness}px`;
        });

        // Configuração dos presets rápidos de cor
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.getAttribute('data-color');
                brushColorInput.value = color;
                currentNeonColor = color;
            });
        });

        // Limpar tela inteira
        clearCanvasBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            showToast('Tela totalmente limpa!', 'info');
        });

        // Sistema Customizado de Feedbacks por Toast de UI sem quebrar a imersão
        let lastToastMode = null;
        function showToast(message, type = 'info') {
            // Evitar spam idêntico se o modo não mudou
            if ((type === 'draw' || type === 'erase' || type === 'pause') && lastToastMode === type) {
                return;
            }
            if (type === 'draw' || type === 'erase' || type === 'pause') {
                lastToastMode = type;
            }

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            let iconSymbol = '⚡';
            if (type === 'erase') iconSymbol = '🧹';
            if (type === 'pause') iconSymbol = '⏸️';
            if (type === 'info') iconSymbol = '✨';

            toast.innerHTML = `<span>${iconSymbol}</span> ${message}`;
            toastContainer.appendChild(toast);

            // Animação de saída automática
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2500);
        }

        // Atualiza as bordas visuais do feedback da câmera no canto
        function updateWebcamFeedback(mode) {
            webcamContainer.className = '';
            if (mode === 'draw') webcamContainer.classList.add('active-draw');
            if (mode === 'erase') webcamContainer.classList.add('active-erase');
            if (mode === 'pause') webcamContainer.classList.add('active-pause');
        }

        // Lógica principal de análise de pontos das mãos (Landmarks)
        function onResults(results) {
            // Esconde o loader no primeiro frame processado
            if (loader.style.opacity !== '0') {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 500);
                showToast('Ar para desenhar iniciado!', 'info');
            }

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                // Se perder a mão da câmera, reseta o traço para não linkar pontos fantasmas
                lastX = null;
                lastY = null;
                return;
            }

            const landmarks = results.multiHandLandmarks[0];

            // Coordenadas das pontas dos dedos e articulações chaves (Y diminui conforme sobe na tela)
            const indexTip = landmarks[8];
            const indexDip = landmarks[6];
            
            const middleTip = landmarks[12];
            const middleDip = landmarks[10];
            
            const ringTip = landmarks[16];
            const ringDip = landmarks[14];
            
            const pinkyTip = landmarks[20];
            const pinkyDip = landmarks[18];

            // Verificação do estado de cada dedo (true se levantado/extendido)
            const isIndexExtended = indexTip.y < indexDip.y;
            const isMiddleExtended = middleTip.y < middleDip.y;
            const isRingExtended = ringTip.y < ringDip.y;
            const isPinkyExtended = pinkyTip.y < pinkyDip.y;

            // Converter coordenadas normalizadas (0 a 1) para o tamanho real da tela do Canvas
            // Nota: MediaPipe capta o vídeo invertido em relação ao nosso espelhamento, então subtraímos de 1 para alinhar perfeitamente com a mão real na tela.
            const screenX = (1 - indexTip.x) * canvas.width;
            const screenY = indexTip.y * canvas.height;

            // Determinação de Modo Baseado em Gestos
            if (isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                // Apenas indicador levantado -> DESENHAR
                if (currentMode !== 'draw') {
                    currentMode = 'draw';
                    showToast('Modo Desenho Ativo', 'draw');
                    updateWebcamFeedback('draw');
                }

                if (lastX !== null && lastY !== null) {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(screenX, screenY);
                    
                    // Configuração de estilo Efeito Neon Real
                    ctx.strokeStyle = currentNeonColor;
                    ctx.lineWidth = currentThickness;
                    ctx.shadowBlur = currentThickness * 1.5;
                    ctx.shadowColor = currentNeonColor;
                    
                    ctx.stroke();
                }
                
                lastX = screenX;
                lastY = screenY;

            } else if (isIndexExtended && isMiddleExtended && isRingExtended && isPinkyExtended) {
                // Todos os dedos estendidos -> APAGAR (Borracha)
                if (currentMode !== 'erase') {
                    currentMode = 'erase';
                    showToast('Modo Borracha Ativo', 'erase');
                    updateWebcamFeedback('erase');
                }

                // Área quadrada de limpeza seguindo a ponta do dedo indicador
                const eraseSize = currentThickness * 5; 
                ctx.clearRect(screenX - eraseSize/2, screenY - eraseSize/2, eraseSize, eraseSize);
                
                // Desenhar um indicador visual discreto da borracha temporário
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(screenX - eraseSize/2, screenY - eraseSize/2, eraseSize, eraseSize);

                lastX = null;
                lastY = null;

            } else {
                // Punho Fechado ou qualquer outra combinação -> PAUSAR
                if (currentMode !== 'pause') {
                    currentMode = 'pause';
                    showToast('Desenho Pausado', 'pause');
                    updateWebcamFeedback('pause');
                }
                
                lastX = null;
                lastY = null;
            }
        }

        // Instanciação e Inicialização do Pipeline do MediaPipe Hands
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        // Inicializador da Câmera do Dispositivo
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        // Executar e capturar erros de permissão de câmera
        camera.start().catch(err => {
            console.error("Erro ao abrir câmera: ", err);
            loaderText.innerHTML = "<span style='color:#c20000;'>Erro: Permissão da câmera negada ou não encontrada.</span>";
            showToast('Por favor, permita o acesso à webcam.', 'pause');
        });

    </script>
</body>
</html>
